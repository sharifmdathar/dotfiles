# mpv default keybindings
# Source: https://github.com/mpv-player/mpv/blob/master/etc/input.conf
#
# These are the standard mpv keybindings. When no input.conf exists,
# mpv uses these same bindings as hardcoded defaults.

#MBTN_LEFT     ignore
#MBTN_LEFT_DBL cycle fullscreen
#MBTN_RIGHT    cycle pause
#MBTN_BACK     playlist-prev
#MBTN_FORWARD  playlist-next

#WHEEL_UP      add volume  2
#WHEEL_DOWN    add volume -2
#WHEEL_LEFT    seek -10
#WHEEL_RIGHT   seek  10

RIGHT seek  5
LEFT  seek -5
UP    seek  60
DOWN  seek -60
Shift+RIGHT no-osd seek  1 exact
Shift+LEFT  no-osd seek -1 exact
Shift+UP    no-osd seek  5 exact
Shift+DOWN  no-osd seek -5 exact
Ctrl+LEFT   no-osd sub-seek -1
Ctrl+RIGHT  no-osd sub-seek  1
Ctrl+Shift+LEFT sub-step -1
Ctrl+Shift+RIGHT sub-step 1
HOME seek 0 absolute
PGUP add chapter 1
PGDWN add chapter -1
Shift+PGUP  seek  600
Shift+PGDWN seek -600
[ multiply speed 1/1.1
] multiply speed 1.1
{ multiply speed 0.5
} multiply speed 2.0
BS set speed 1
Shift+BS revert-seek
Shift+Ctrl+BS revert-seek mark
q quit
Q quit-watch-later
ESC set fullscreen no
p cycle pause
. frame-step
, frame-back-step
SPACE cycle pause
> playlist-next
ENTER playlist-next
< playlist-prev
O no-osd cycle-values osd-level 3 1
o show-progress
P show-progress
i script-binding stats/display-stats
I script-binding stats/display-stats-toggle
` script-binding commands/open
z add sub-delay -0.1
Z add sub-delay  0.1
x add sub-delay  0.1
ctrl++ add audio-delay  0.1
ctrl+- add audio-delay -0.1
G add sub-scale  0.1
F add sub-scale -0.1
9 add volume -2
/ add volume -2
0 add volume  2
* add volume  2
m cycle mute
1 add contrast -1
2 add contrast 1
3 add brightness -1
4 add brightness 1
5 add gamma -1
6 add gamma 1
7 add saturation -1
8 add saturation 1
Alt+0 set window-scale 0.5
Alt+1 set window-scale 1
Alt+2 set window-scale 2
b cycle deband
d cycle deinterlace
r add sub-pos -1
R add sub-pos +1
t add sub-pos +1
v cycle sub-visibility
Alt+v cycle secondary-sub-visibility
j cycle sub
J cycle sub down
SHARP cycle audio
_ cycle video
T cycle ontop
f cycle fullscreen
s screenshot
S screenshot video
Ctrl+s screenshot window
Alt+s screenshot each-frame
w add panscan -0.1
W add panscan +0.1
e add panscan +0.1
A cycle-values video-aspect-override "16:9" "4:3" "2.35:1" "no"
l ab-loop
L cycle-values loop-file inf no
ctrl+c quit 4
ctrl+w quit
E cycle edition
POWER quit
PLAY cycle pause
PAUSE cycle pause
PLAYPAUSE cycle pause
PLAYONLY set pause no
PAUSEONLY set pause yes
STOP quit
FORWARD seek 60
REWIND seek -60
NEXT playlist-next
PREV playlist-prev
VOLUME_UP add volume 2
VOLUME_DOWN add volume -2
MUTE cycle mute
CLOSE_WIN quit
ctrl+h cycle-values hwdec no auto
F8 show-text ${playlist}
F9 show-text ${track-list}
DEL script-binding osc/visibility
